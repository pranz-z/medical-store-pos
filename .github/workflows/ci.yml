name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, tests, migrations
    runs-on: ubuntu-latest
    env:
      # Placeholder values so Next.js build/typegen never touches real secrets.
      AUTH_SECRET: ci-placeholder-secret-000000000000000000000000
      TURSO_DATABASE_URL: file:ci.db
      APP_TIMEZONE: Asia/Manila
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Migrations apply cleanly to a fresh database
        run: npm run db:migrate

      - name: Migration drift check (generated SQL must be committed)
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle

      - name: Build (placeholder env)
        run: npm run build

      - name: Dependency audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true
